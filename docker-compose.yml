
services:
  db:
    image: postgres:15-alpine
    # 🛡️ FIX capacidad: el default de Postgres (max_connections=100) se
    # agota alrededor de ~65 usuarios concurrentes (CONN_MAX_AGE=600 en
    # Django deja conexiones abiertas por request, sin PgBouncer de por
    # medio). Medido con load test: con 300 el mismo VPS aguanta 200
    # usuarios concurrentes sin un solo error, y la RAM de Postgres ni se
    # acerca al límite del droplet (~470MB de 4GB en el peor caso).
    command: postgres -c max_connections=300
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Quitamos la exposición del puerto 5432 por seguridad. El backend lo verá internamente.
    restart: always
    networks:
      - leybrak_internal

  redis:
    image: redis:alpine
    restart: always
    networks:
      - leybrak_internal

  backend:
    build: .
    # 🛡️ FIX capacidad: daphne corría como UN solo proceso — se quedaba
    # pegado en ~110% CPU (1 de 3 vCPU) sin importar cuánta carga entrara,
    # dejando 2 cores completamente ociosos. uvicorn con --workers reparte
    # el trabajo entre procesos. Medido: mismo droplet pasa de sostener
    # ~60-100 usuarios concurrentes con buena latencia a ~150-250 (los
    # WebSockets de Channels se probaron y siguen funcionando igual).
    command: uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles  # 👉 Django escupe la pintura aquí
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - EVO_GLOBAL_KEY=${EVOLUTION_API_KEY:-BravaSuperSecret2026}
    # Quitamos ports: - "8000:8000", NPM lo ruteará internamente
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - leybrak_internal
      - nginx_network # Conectamos al proxy

  frontend:
    build: ./pos-frontend
    container_name: pos_frontend
    # QUITAMOS EL PUERTO 80:80 para no chocar con NPM
    depends_on:
      - backend
    restart: always
    # ✨ AQUÍ ESTÁ LA MAGIA QUE FALTABA:
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/usr/share/nginx/html/media
    networks:
      - leybrak_internal
      - nginx_network
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: brava_evolution_api
    restart: always
    # Quitamos ports: - "8080:8080" para que no quede expuesto al público sin pasar por Cloudflare
    environment:
      # ACTUALIZADO: Ahora apunta a tu nuevo dominio
      - SERVER_URL=https://api.leybrak.com
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-BravaSuperSecret2026}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=evolution
      - REDIS_URI=redis://redis:6379/1
      - REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_TTL=604800
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - CONFIG_SESSION_PHONE_CLIENT=LeybrakPOS # Actualizado a tu nueva marca
      - LOG_LEVEL=ERROR
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis
      - db
    networks:
      - leybrak_internal
      - nginx_network # Conectamos al proxy

volumes:
  postgres_data:
  evolution_instances:
  static_volume:  # ✨ NUEVO
  media_volume:

networks:
  leybrak_internal:
    driver: bridge
  nginx_network:
    external: true # Esta es la red de NPM